name: Update Submodules
on:
  repository_dispatch:
    types: [update_submodule]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout root repo (Default Branch)
        uses: actions/checkout@v3
        with:
          # Start by checking out the default branch to ensure we have a base
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Switch to target branch (Create if missing)
        run: |
          TARGET_BRANCH="${{ github.event.client_payload.branch }}"
          
          # Check if the branch exists on the remote
          if git ls-remote --heads origin "$TARGET_BRANCH" | grep -q "$TARGET_BRANCH"; then
            echo "Branch $TARGET_BRANCH exists. Switching..."
            git checkout "$TARGET_BRANCH"
          else
            echo "Branch $TARGET_BRANCH not found. Creating from default..."
            git checkout -b "$TARGET_BRANCH"
          fi

      - name: Sync and update submodules
        run: |
          git submodule init
          TARGET_REPO="${{ github.event.client_payload.repo }}"
          TARGET_BRANCH="${{ github.event.client_payload.branch }}"
          echo "Looking for submodule matching repo: $TARGET_REPO"
          SUB_PATH=$(git config --file .gitmodules --get-regexp url | grep "$TARGET_REPO" | awk '{print $1}' | sed 'submodule\.\(.*\)\.url/\1/')
          if [ -z "$SUB_PATH" ]; then
             SUB_PATH=$(git config --file .gitmodules --get-regexp path | grep -i "bora" | head -n 1 | awk '{print $2}')
          else
             SUB_PATH=$(git config --file .gitmodules --get "submodule.$SUB_PATH.path")
          fi

          if [ -n "$SUB_PATH" ]; then
            echo "Found submodule at path: $SUB_PATH. Updating to branch: $TARGET_BRANCH"
            git submodule update --init "$SUB_PATH"
            cd "$SUB_PATH"
            git fetch origin "$TARGET_BRANCH"
            git checkout "$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"
            cd -
          else
            echo "ERROR: Could not find a submodule path matching $TARGET_REPO in .gitmodules!"
            echo "Current .gitmodules content:"
            cat .gitmodules
            exit 1 # Fail the build so you can see the log
          fi

      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update submodules from ${{ github.event.client_payload.repo }} on branch ${{ github.event.client_payload.branch }}"
            # Use -u to set up tracking for newly created branches
            git push -u origin HEAD:"${{ github.event.client_payload.branch }}"
          else
            echo "No changes to commit."
          fi